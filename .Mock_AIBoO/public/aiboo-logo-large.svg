<svg width="300" height="100" viewBox="0 0 110 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .logo-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-weight: 700;
        fill: #000000;
      }
      .logo-text-big {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-weight: 700;
        fill: #000000;
      }
    </style>
  </defs>
  
  <!-- A - slightly bigger -->
  <text x="2" y="28" class="logo-text-big" style="font-size: 33px;">A</text>
  
  <!-- Red dot above i - aligned with A height -->
  <circle cx="30" cy="10" r="3.6" fill="#FF4D4F" />
  
  <!-- i - vertical line below the red dot (width = dot diameter × 2/3 = 4.8) -->
  <rect x="27.6" y="15" width="4.8" height="13" fill="#000000" rx="1" />
  
  <!-- B - moved left -->
  <text x="36" y="28" class="logo-text" style="font-size: 28px;">B</text>
  
  <!-- o - moved left -->
  <text x="54" y="28" class="logo-text" style="font-size: 28px;">o</text>
  
  <!-- O - moved left -->
  <text x="70" y="28" class="logo-text" style="font-size: 28px;">O</text>
</svg>
